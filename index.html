<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>human-spec</title>
<meta name="description" content="human-spec, an OpenSpec viewer: a standalone dashboard that reads any repository's openspec/ folder (local folder or GitHub) and visualizes capabilities, requirements, changes, spec deltas and task progress.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,75..100,400..700;1,100,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..600;1,8..60,400&display=swap">
<style>
:root{
  color-scheme: light;
  /* ink on drafting paper; colour is reserved for state */
  --ground:#e6e9ee; --sheet:#fcfcfb; --well:#f1f3f6;
  --ink:#1b2340; --ink-2:#4b5470; --muted:#6e7691;
  --rule:#c6ccd6; --hair:#e2e6ec;
  --accent:#2b5ea7; --accent-ink:#1f4a86; --accent-soft:#dbe6f6;
  --good:#0ca30c; --good-ink:#0a6b0a; --good-soft:#dff3df;
  --warn:#fab219; --warn-ink:#7a5200; --warn-soft:#fdf0cc;
  --serious:#ec835a; --serious-ink:#8a3a1a; --serious-soft:#fde3d8;
  --crit:#d03b3b; --crit-ink:#8e2323; --crit-soft:#f8dcdc;
  --violet:#6250d6; --violet-ink:#4a3cb0; --violet-soft:#e3dff8;
  --sans:"Archivo","Helvetica Neue",Arial,sans-serif;
  --serif:"Source Serif 4","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:3px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --ground:#0e1118; --sheet:#161a24; --well:#1d222e;
    --ink:#e7eaf1; --ink-2:#b3b9ca; --muted:#8a92a8;
    --rule:#3a4154; --hair:#282e3c;
    --accent:#5b8fdc; --accent-ink:#9dbdf0; --accent-soft:#1d3050;
    --good:#0ca30c; --good-ink:#6fd66f; --good-soft:#163d16;
    --warn:#fab219; --warn-ink:#f5c95a; --warn-soft:#3d2f0a;
    --serious:#ec835a; --serious-ink:#f3a98a; --serious-soft:#3f2316;
    --crit:#d03b3b; --crit-ink:#ee8a8a; --crit-soft:#3f1b1b;
    --violet:#9085e9; --violet-ink:#b1a8f2; --violet-soft:#2a2550;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --ground:#0e1118; --sheet:#161a24; --well:#1d222e;
  --ink:#e7eaf1; --ink-2:#b3b9ca; --muted:#8a92a8;
  --rule:#3a4154; --hair:#282e3c;
  --accent:#5b8fdc; --accent-ink:#9dbdf0; --accent-soft:#1d3050;
  --good:#0ca30c; --good-ink:#6fd66f; --good-soft:#163d16;
  --warn:#fab219; --warn-ink:#f5c95a; --warn-soft:#3d2f0a;
  --serious:#ec835a; --serious-ink:#f3a98a; --serious-soft:#3f2316;
  --crit:#d03b3b; --crit-ink:#ee8a8a; --crit-soft:#3f1b1b;
  --violet:#9085e9; --violet-ink:#b1a8f2; --violet-soft:#2a2550;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ground);color:var(--ink);font:13.5px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
a{color:var(--accent-ink)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:5px 11px;font-weight:500;line-height:1.4}
button:hover{background:var(--well)}
button.primary{background:var(--ink);border-color:var(--ink);color:var(--sheet)}
button.primary:hover{background:var(--ink-2);border-color:var(--ink-2)}
button.ghost{border-color:transparent;background:transparent}
button.ghost:hover{background:var(--well)}
button.small{padding:2px 8px;font-size:12.5px}
input[type=text],input[type=password],input[type=search]{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:6px 9px;width:100%}
input[type=search]{appearance:none;-webkit-appearance:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
code{font-family:var(--mono);font-size:.88em;background:var(--well);padding:1px 5px;border-radius:2px}
pre{font-family:var(--mono);font-size:12.5px;line-height:1.5;background:var(--well);border:1px solid var(--hair);border-radius:var(--r);padding:10px 12px;overflow:auto;white-space:pre-wrap}
pre code{background:none;padding:0}
hr{border:0;border-top:1px solid var(--hair);margin:16px 0}
.num{font-variant-numeric:tabular-nums;font-stretch:88%;letter-spacing:-.005em}

/* top bar */
.topbar{position:sticky;top:0;z-index:20;background:var(--sheet);border-bottom:1px solid var(--rule);display:flex;align-items:center;gap:18px;padding:0 22px;min-height:50px;flex-wrap:wrap}
.brand{color:inherit;text-decoration:none;font-weight:600;font-stretch:90%;font-size:14.5px;letter-spacing:-.01em;display:flex;align-items:center;gap:9px;white-space:nowrap}
.brand .mark{width:13px;height:16px;border:1.5px solid var(--ink);border-left-width:4px;border-radius:1px;display:inline-block}
.nav{display:flex;gap:18px;align-self:stretch}
.nav a{display:inline-flex;align-items:center;gap:5px;text-decoration:none;color:var(--ink-2);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;padding:0 1px;min-height:50px}
.nav a:hover{color:var(--ink)}
.nav a.on{color:var(--ink);border-bottom-color:var(--ink)}
.nav a .c{color:var(--muted);font-weight:400;font-size:12px}
.src{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--ink-2);flex-wrap:wrap;padding:8px 0}
.srcmenu{position:relative}
.src .chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--rule);border-radius:var(--r);padding:2px 8px 2px 9px;max-width:380px;white-space:nowrap;font:inherit;color:var(--ink-2);background:var(--sheet);cursor:pointer;line-height:1.6}
.src .chip:hover,.src .chip[aria-expanded="true"]{background:var(--well)}
.src .chip b{color:var(--ink);font-weight:600;overflow:hidden;text-overflow:ellipsis;min-width:0}
.chip .caret{width:5px;height:5px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:rotate(45deg);margin:-3px 0 0 1px;flex:none}
.menu{position:absolute;top:calc(100% + 4px);left:0;min-width:170px;background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:4px;z-index:30;display:flex;flex-direction:column;box-shadow:0 8px 20px -8px rgba(27,35,64,.35)}
.menu [role=menuitem]{display:block;width:100%;text-align:left;padding:6px 10px;border:0;background:none;border-radius:2px;color:var(--ink);text-decoration:none;font:inherit;font-size:13px;cursor:pointer;white-space:nowrap}
.menu [role=menuitem]:hover{background:var(--well)}
.igrp{display:inline-flex;align-items:center;gap:2px}
.ibtn{display:inline-flex;align-items:center;justify-content:center;width:28px;height:26px;padding:0;color:var(--ink-2);border-radius:var(--r);text-decoration:none}
.ibtn:hover{color:var(--ink);background:var(--well)}
button.ibtn{border:0;background:transparent}
button.ibtn:hover{background:var(--well)}
.dot{width:8px;height:8px;border-radius:1px;background:var(--muted);display:inline-block;flex:none}
.dot.live{background:var(--good)}
.dot.busy{background:var(--warn);animation:pulse 1s infinite}
.dot.err{background:var(--crit)}
@keyframes pulse{50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){.dot.busy{animation:none}.bar i{transition:none}details.req>summary::before{transition:none}}
label.tgl{display:inline-flex;align-items:center;gap:5px;cursor:pointer;user-select:none}
label.tgl input{margin:0;accent-color:var(--ink)}
label.sw input{appearance:none;-webkit-appearance:none;width:28px;height:16px;border-radius:8px;background:var(--rule);position:relative;cursor:pointer;flex:none;transition:background .15s}
label.sw input::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:var(--sheet);transition:transform .15s}
label.sw input:checked{background:var(--good)}
label.sw input:checked::after{transform:translateX(12px)}
@media (prefers-reduced-motion:reduce){label.sw input,label.sw input::after{transition:none}}

/* the sheet */
main.sheet{max-width:1440px;margin:22px auto 48px;background:var(--sheet);border:1px solid var(--rule);padding:26px 32px 56px;min-height:60vh}
@media (max-width:760px){main.sheet{margin:0;border:0;border-top:1px solid var(--rule);padding:18px 16px 48px}}
@media (max-width:760px){.topbar{padding:0 16px;gap:0 14px}.nav{gap:14px}.nav a{min-height:40px}.src{padding:6px 0 10px;gap:8px}}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px 32px;flex-wrap:wrap;padding-bottom:16px;border-bottom:2px solid var(--ink);margin-bottom:22px}
.head .hl{min-width:0;flex:1 1 320px}
.head h1{margin:0 0 6px}
.head .tb{flex:0 1 auto}
h1{font-size:26px;line-height:1.15;margin:0 0 6px;font-weight:600;font-stretch:92%;letter-spacing:-.015em;overflow-wrap:anywhere}
h2{font-size:17px;line-height:1.3;margin:30px 0 12px;font-weight:600;letter-spacing:-.005em;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;padding-bottom:6px;border-bottom:1px solid var(--rule)}
h2 .hn{font-weight:400;font-size:12.5px;color:var(--muted);margin-left:auto}
h3{font-size:14.5px;margin:18px 0 8px;font-weight:600}
.h2row{display:flex;justify-content:space-between;align-items:flex-end;gap:10px 16px;flex-wrap:wrap;border-bottom:1px solid var(--rule);margin:30px 0 12px}
.h2row h2{border:0;margin:0}
.h2row .row{padding-bottom:6px}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 0;color:var(--ink-2);font-size:12.5px;margin:0}
.meta>span+span::before{content:"";display:inline-block;width:1px;height:11px;background:var(--rule);margin:0 10px;vertical-align:-1px}
.meta .path{font-family:var(--mono);font-size:11.5px;color:var(--muted)}

/* title block */
.tb{display:grid;grid-auto-flow:column;border:1px solid var(--rule);border-radius:var(--r);background:var(--sheet)}
.tb>div{padding:7px 14px 8px;border-left:1px solid var(--rule);min-width:0}
.tb>div:first-child{border-left:0}
.tb .v{font-size:22px;line-height:1.1;font-weight:600;font-stretch:88%;font-variant-numeric:tabular-nums;letter-spacing:-.01em;white-space:nowrap}
.tb .v .pill{font-size:13px;font-stretch:100%;letter-spacing:0;font-weight:600;margin-top:4px;display:inline-flex}
.tb .l{font-size:12px;color:var(--ink-2);margin-top:1px;white-space:nowrap}
.tb .s{font-size:11.5px;color:var(--muted);margin-top:3px;white-space:nowrap}
@media (max-width:900px){
  .tb{grid-auto-flow:row;grid-template-columns:repeat(3,1fr);width:100%}
  .tb>div{border-left:0;border-top:1px solid var(--rule)}
  .tb>div:nth-child(-n+3){border-top:0}
  .tb>div:not(:nth-child(3n+1)){border-left:1px solid var(--rule)}
}
@media (max-width:480px){
  .tb{grid-template-columns:repeat(2,1fr)}
  .tb>div:nth-child(-n+3){border-top:1px solid var(--rule)}
  .tb>div:nth-child(-n+2){border-top:0}
  .tb>div:not(:nth-child(3n+1)){border-left:0}
  .tb>div:nth-child(2n){border-left:1px solid var(--rule)}
}

/* blocks */
.card{border:1px solid var(--rule);border-radius:var(--r);padding:16px 18px;background:var(--sheet)}
.doc{border-left:2px solid var(--rule);padding:4px 0 4px 18px;margin:12px 0}
.grid{display:grid;gap:12px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 40px}
@media (max-width:900px){.two{grid-template-columns:1fr}}
.bar{height:5px;background:var(--hair);border-radius:1px;overflow:hidden;position:relative}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.bar.done i{background:var(--good)}
.bar.lg{height:8px}
.pill{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:500;color:var(--ink-2);white-space:nowrap}
.pill .dot{width:9px;height:9px}
.pill.progress .dot{background:var(--accent)}
.pill.complete .dot{background:var(--good)}
.pill.archived .dot{background:var(--muted)}
.pill.draft .dot{background:var(--warn)}
.pill.untouched .dot{background:transparent;border:1.5px solid var(--muted)}
.badge{display:inline-block;font-size:11px;line-height:1.6;font-weight:600;font-stretch:92%;padding:0 6px;border-radius:2px;vertical-align:middle;white-space:nowrap;text-decoration:none}
.badge.add{background:var(--good-soft);color:var(--good-ink)}
.badge.mod{background:var(--warn-soft);color:var(--warn-ink)}
.badge.rem{background:var(--crit-soft);color:var(--crit-ink)}
.badge.ren{background:var(--violet-soft);color:var(--violet-ink)}
.badge.new{background:var(--accent-soft);color:var(--accent-ink)}
.badge.gray{background:var(--well);color:var(--ink-2)}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;line-height:1.5;padding:1px 7px;border-radius:2px;background:var(--sheet);color:var(--ink-2);text-decoration:none;border:1px solid var(--rule);white-space:nowrap}
a.tag:hover{border-color:var(--ink-2);color:var(--ink)}
.muted{color:var(--muted)}.small{font-size:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}
.empty{color:var(--muted);padding:18px 0}
.err{border-left:3px solid var(--crit);background:var(--crit-soft);color:var(--crit-ink);padding:8px 12px;border-radius:0 var(--r) var(--r) 0;margin:10px 0}
.notice{border-left:3px solid var(--warn);background:var(--warn-soft);color:var(--warn-ink);padding:8px 12px;border-radius:0 var(--r) var(--r) 0;margin:10px 0}

/* ledger of active changes */
.ledger{border:1px solid var(--rule);border-radius:var(--r);overflow:hidden}
.ledger .grp{display:flex;justify-content:space-between;align-items:center;padding:5px 14px;background:var(--well);font-size:12.5px;color:var(--ink-2);border-top:1px solid var(--rule)}
.ledger .grp:first-child{border-top:0}
.lrow{display:grid;grid-template-columns:minmax(180px,1.2fr) minmax(170px,1fr) minmax(0,1.6fr) auto;gap:8px 18px;align-items:center;padding:10px 14px;border-top:1px solid var(--hair);text-decoration:none;color:inherit}
.lrow:hover{background:var(--well)}
.lrow .n{font-weight:600;min-width:0;overflow-wrap:anywhere}
.lrow .pg{display:flex;align-items:center;gap:10px;min-width:0}
.lrow .pg .bar{flex:1}
.lrow .pg .num{min-width:54px;text-align:right;font-size:12.5px;color:var(--ink-2)}
.lrow .caps{display:flex;flex-wrap:wrap;gap:4px;min-width:0}
.lrow .when{font-size:12px;color:var(--muted);white-space:nowrap;text-align:right}
@media (max-width:820px){.lrow{grid-template-columns:minmax(0,1fr) auto}.lrow .pg{grid-column:1/-1}.lrow .caps{grid-column:1/-1}}

/* next tasks + attention */
.nx{padding:10px 0;border-bottom:1px solid var(--hair)}
.nx .t{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.nx .t a{font-weight:600;text-decoration:none;color:inherit}
.nx ul{margin:6px 0 0;padding:0;list-style:none}
.nx li{display:flex;gap:9px;padding:3px 0;font-size:13px;color:var(--ink-2);align-items:flex-start}
.nx li .cb{margin-top:3px}
.issue{display:grid;grid-template-columns:16px 1fr;gap:10px;align-items:start;padding:8px 0;border-bottom:1px solid var(--hair);font-size:13px}
.issue .ic{width:16px;height:16px;border-radius:1px;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#1b2340;background:var(--warn);margin-top:2px}
.issue .ic.info{background:var(--accent-soft);color:var(--accent-ink)}
.issue .ic.crit{background:var(--crit);color:#fff}
.issue a{white-space:nowrap}

/* impact matrix */
.matrix{overflow:auto;border:1px solid var(--rule);border-radius:var(--r)}
.matrix table{border-collapse:collapse;font-size:12.5px;min-width:100%}
.matrix th,.matrix td{padding:7px 12px;border-bottom:1px solid var(--hair);text-align:center;white-space:nowrap}
.matrix th{font-weight:600;color:var(--ink-2);background:var(--well);position:sticky;top:0;z-index:1}
.matrix th a{color:inherit;text-decoration:none}
.matrix td:first-child,.matrix th:first-child{text-align:left;position:sticky;left:0;background:var(--sheet);font-weight:600;border-right:1px solid var(--hair)}
.matrix th:first-child{background:var(--well);z-index:2}
.matrix td:first-child a{color:inherit;text-decoration:none}
.matrix tr:last-child td{border-bottom:0}
.matrix .cell{display:inline-flex;gap:3px}
.matrix tbody tr:hover td{background:var(--well)}

/* capability entries */
.capgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:0 36px}
.capentry{display:block;padding:12px 0;border-bottom:1px solid var(--hair);text-decoration:none;color:inherit}
.capentry:hover .n{text-decoration:underline;text-decoration-color:var(--rule)}
.capentry .t{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.capentry .n{font-weight:600;font-size:14.5px}
.capentry .p{font-family:var(--serif);font-size:14px;line-height:1.5;color:var(--ink-2);margin:3px 0 6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.capentry .m{font-size:12px;color:var(--muted);display:flex;gap:4px 12px;flex-wrap:wrap;align-items:center}
.capentry.ghost .n{color:var(--ink-2)}

/* history ledger */
.tl{display:grid;grid-template-columns:104px 1fr}
.tl .d{color:var(--muted);font-variant-numeric:tabular-nums;font-size:12.5px;padding:9px 0;border-bottom:1px solid var(--hair)}
.tl .e{padding:9px 0;border-bottom:1px solid var(--hair);display:flex;gap:6px 10px;align-items:center;flex-wrap:wrap}
.tl a{text-decoration:none;color:var(--ink);font-weight:600}

/* side list */
.split{display:grid;grid-template-columns:270px minmax(0,1fr);gap:36px;align-items:start}
@media (max-width:900px){.split{grid-template-columns:1fr;gap:20px}.side{position:static!important;max-height:none!important;border-right:0!important;padding-right:0!important;border-bottom:1px solid var(--rule);padding-bottom:12px}}
.side{position:sticky;top:60px;max-height:calc(100vh - 80px);overflow:auto;padding-right:18px;border-right:1px solid var(--rule)}
.side h4{margin:16px 0 6px;font-size:12.5px;font-weight:600;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.side h4:first-child{margin-top:4px}
.side .item{display:block;padding:7px 10px;margin-left:-2px;border-left:2px solid transparent;text-decoration:none;color:var(--ink);border-radius:0 var(--r) var(--r) 0}
.side .item:hover{background:var(--well)}
.side .item.on{background:var(--well);border-left-color:var(--ink)}
.side .item .t{display:flex;justify-content:space-between;gap:8px;align-items:center}
.side .item .n{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side .item.on .n{font-weight:600}
.side .item .m{font-size:11.5px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.side .item .bar{margin-top:6px}
.side input[type=search]{margin:4px 0 8px}

/* requirements */
.reqs{border-top:1px solid var(--rule)}
details.req{border-bottom:1px solid var(--hair)}
details.req>summary{list-style:none;cursor:pointer;padding:10px 4px 10px 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
details.req>summary:hover{background:var(--well)}
details.req>summary::-webkit-details-marker{display:none}
details.req>summary::before{content:"";width:6px;height:6px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:rotate(-45deg);transition:transform .15s;flex:none;margin:0 6px 0 8px}
details.req[open]>summary::before{transform:rotate(45deg)}
details.req>summary .rn{font-weight:600;flex:1 1 auto;min-width:0}
details.req>summary .rm{font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
details.req .rb{padding:2px 0 18px 30px;font-family:var(--serif);font-size:15px;line-height:1.55;max-width:78ch}
details.req .rb .row,details.req .rb .notice,details.req .rb .badge{font-family:var(--sans);font-size:13px}
details.req .rb .notice{font-size:13px}
details.req.pending{border-left:2px dashed var(--good)}
details.req.pending>summary{padding-left:4px}
details.req.removed>summary .rn{text-decoration:line-through;text-decoration-color:var(--crit);color:var(--ink-2)}
.scn{margin:12px 0 0;padding:6px 0 6px 14px;border-left:2px solid var(--accent-soft)}
.scn .st{font-family:var(--sans);font-weight:600;font-size:13px;color:var(--ink-2);margin-bottom:4px}
.scn ul{list-style:none;padding:0;margin:0}
.scn li{padding:2px 0;color:var(--ink-2);display:flex;gap:10px;align-items:baseline}
.kw{display:inline-block;font-family:var(--sans);font-size:11px;font-weight:700;font-stretch:88%;letter-spacing:.03em;min-width:44px;flex:none;color:var(--muted);line-height:1.7}
.kw.WHEN,.kw.GIVEN{color:var(--accent-ink)}
.kw.THEN{color:var(--good-ink)}
.md{font-family:var(--serif);font-size:15px;line-height:1.6;max-width:78ch}
.md>:first-child{margin-top:0}.md>:last-child{margin-bottom:0}
.md h1,.md h2,.md h3,.md h4{font-family:var(--sans);border:0;padding:0;display:block;letter-spacing:0;font-stretch:100%}
.md h1{font-size:19px;margin:22px 0 8px}.md h2{font-size:16px;margin:22px 0 8px}.md h3{font-size:14.5px;margin:18px 0 6px}.md h4{font-size:13.5px;margin:14px 0 6px}
.md p{margin:8px 0}.md ul,.md ol{margin:6px 0;padding-left:24px}.md li{margin:3px 0}
.md li.task{list-style:none;margin-left:-20px}

.cb{display:inline-block;width:13px;height:13px;border:1.5px solid var(--rule);border-radius:1px;vertical-align:-2px;margin-right:0;position:relative;flex:none}
.cb.on{background:var(--good);border-color:var(--good)}
.cb.on::after{content:"";position:absolute;left:3.5px;top:0.5px;width:3.5px;height:7px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}

/* tasks */
.tsec{margin-bottom:22px}
.tsec .th{display:flex;gap:12px;align-items:center;padding:0 0 7px;border-bottom:1px solid var(--rule)}

.tsec li.d1{padding-left:32px}.tsec li.d2{padding-left:60px}

/* diff */
.diff{white-space:pre-wrap;font-family:var(--serif);font-size:15px;line-height:1.55;max-width:78ch}
.diff del{background:var(--crit-soft);color:var(--crit-ink);text-decoration:line-through;text-decoration-color:rgba(142,35,35,.5)}
.diff ins{background:var(--good-soft);color:var(--good-ink);text-decoration:none}
.renames{margin:8px 0;border-top:1px solid var(--rule)}
.renames .row{padding:8px 0;border-bottom:1px solid var(--hair)}

/* subtabs */
.tabs{display:flex;gap:22px;border-bottom:1px solid var(--rule);margin:18px 0 18px;flex-wrap:wrap}

/* welcome + dialog */

@media (max-width:700px){.opts{grid-template-columns:1fr}.opt+.opt{border-left:0!important;border-top:1px solid var(--rule);padding-left:0!important}.opt{padding-right:0!important}}

dialog{border:1px solid var(--rule);border-radius:var(--r);background:var(--sheet);color:var(--ink);padding:0;max-width:760px;width:calc(100% - 32px)}
dialog::backdrop{background:rgba(27,35,64,.45)}
dialog .dbody{padding:20px 24px 24px}
dialog .dbody h2{border:0;margin:0;padding:0}
dialog .opts{margin-top:14px}
.recent{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;align-items:center}
.field{margin:10px 0}.field label{display:block;font-size:12.5px;color:var(--ink-2);margin-bottom:4px}
.filelist{font-family:var(--mono);font-size:12px;color:var(--ink-2);margin:0;padding-left:18px}
.filelist li{padding:2px 0}
kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--rule);border-bottom-width:2px;border-radius:2px;padding:0 4px}

/* diagrams: inline SVG, styled here so both themes apply */

.dia .box{fill:var(--well);stroke:var(--rule)}

.dia .al{font-size:11px;fill:var(--muted)}

.dia .pf{fill:var(--accent)}

.hn button.small{margin-left:6px}

<body>
<header class="topbar">
  <a class="brand" href="#/overview" title="Overview"><span class="mark"></span>human-spec</a>
  <nav class="nav" id="nav"></nav>
  <div class="src" id="srcbar"></div>
</header>
<main id="app" class="sheet"></main>
<dialog id="dlg"><div class="dbody" id="dlgbody"></div></dialog>

<script>
/* =========================================================
   human-spec, an OpenSpec viewer: a single-file dashboard for openspec/ folders.
   Sources: local folder (File System Access API, with <input webkitdirectory>
   and drag-and-drop fallbacks) or a GitHub repository (API + raw).
   ========================================================= */
'use strict';

// ---------- utilities ----------
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
const plural = (n, w, p) => `${n} ${n === 1 ? w : (p || w + 's')}`;
const TEXT_EXT = /\.(md|markdown|yaml|yml|json|txt|csv)$/i;
const SKIP_DIRS = new Set(['node_modules', '.git', 'dist', 'build', 'target', 'vendor', '.next', 'venv', '.venv', '__pycache__', 'coverage', '.cache', 'out']);
const ago = ts => {
  if (!ts) return '';
  const s = Math.max(0, (Date.now() - ts) / 1000);
  if (s < 60) return 'just now';
  if (s < 3600) return `${Math.floor(s / 60)} min ago`;
  if (s < 86400) return `${Math.floor(s / 3600)} h ago`;
  const d = Math.floor(s / 86400);
  return d === 1 ? 'yesterday' : `${d} days ago`;
};
const fmtDate = ts => ts ? new Date(ts).toISOString().slice(0, 10) : '';

// ---------- state ----------
const state = {
  source: null,      // {type:'local'|'github'|'files', label, handle?, repo?, ref?, token?, treeSha?}
  files: null,       // [{path, text, mtime}] relative to the openspec folder
  model: null,
  status: 'idle',    // idle | busy | live | error
  error: null,
  loadedAt: 0,
  auto: localStorage.getItem('osv.auto') !== '0',
  open: new Set(),   // open <details> keys
  openOnly: localStorage.getItem('osv.openOnly') === '1',
  deltaView: {},     // key -> 'proposed'|'current'|'diff'
  stageFilter: null, // lifecycle stage the Overview ledger is narrowed to
  impactView: 'flow', // 'flow'|'matrix' on the Overview
  route: { view: 'overview', id: null, tab: null }
};

// ---------- mini markdown ----------
function inline(s) {
  s = esc(s);
  const codes = [];
  s = s.replace(/`([^`]+)`/g, (_, c) => { codes.push(c); return `\u0000${codes.length - 1}\u0000`; });
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>').replace(/__([^_]+)__/g, '<strong>$1</strong>');
  s = s.replace(/(^|[^*\w])\*([^*\n]+)\*(?!\w)/g, '$1<em>$2</em>').replace(/(^|[^_\w])_([^_\n]+)_(?!\w)/g, '$1<em>$2</em>');
  s = s.replace(/~~([^~]+)~~/g, '<del>$1</del>');
  s = s.replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g, (_, a, b) => `<span class="wl">${b || a}</span>`);
  s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (_, t, u) => /^https?:/.test(u) ? `<a href="${u}" target="_blank" rel="noopener">${t}</a>` : `<span class="wl">${t}</span>`);
  s = s.replace(/\u0000(\d+)\u0000/g, (_, i) => `<code>${codes[i]}</code>`);
  return s;
}
function renderList(lines) {
  const root = { indent: -1, children: [] };
  const stack = [root];
  for (const raw of lines) {
    const m = raw.match(/^(\s*)([-*+]|\d+[.)])\s+(.*)$/);
    if (!m) { const last = stack[stack.length - 1]; if (last !== root) last.text += ' ' + raw.trim(); continue; }
    const node = { indent: m[1].length, ordered: /\d/.test(m[2]), text: m[3], children: [] };
    while (stack.length > 1 && stack[stack.length - 1].indent >= node.indent) stack.pop();
    stack[stack.length - 1].children.push(node);
    stack.push(node);
  }
  const rec = nodes => {
    if (!nodes.length) return '';
    const tag = nodes[0].ordered ? 'ol' : 'ul';
    return `<${tag}>` + nodes.map(n => {
      let t = n.text, cb = '';
      const c = t.match(/^\[([ xX])\]\s*(.*)$/);
      if (c) { cb = `<span class="cb ${c[1] !== ' ' ? 'on' : ''}"></span>`; t = c[2]; }
      return `<li class="${cb ? 'task' : ''}">${cb}${inline(t)}${rec(n.children)}</li>`;
    }).join('') + `</${tag}>`;
  };
  return rec(root.children);
}
function md(src) {
  if (!src) return '';
  const lines = src.replace(/\r\n?/g, '\n').split('\n');
  const out = [];
  let i = 0;
  const isBlockStart = l => /^(#{1,6}\s|\s*```|\s*~~~|\s*>|\s*([-*+]|\d+[.)])\s+|\s*\|)/.test(l);
  while (i < lines.length) {
    const l = lines[i];
    let m;
    if (/^\s*$/.test(l)) { i++; continue; }
    if ((m = l.match(/^\s*(```|~~~)/))) {
      const fence = m[1]; const buf = []; i++;
      while (i < lines.length && !lines[i].trim().startsWith(fence)) { buf.push(lines[i]); i++; }
      i++; out.push(`<pre><code>${esc(buf.join('\n'))}</code></pre>`); continue;
    }
    if ((m = l.match(/^(#{1,6})\s+(.*?)\s*#*\s*$/))) { out.push(`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`); i++; continue; }
    if (/^\s*([-*_])(\s*\1){2,}\s*$/.test(l)) { out.push('<hr>'); i++; continue; }
    if (/^\s*>/.test(l)) {
      const buf = [];
      while (i < lines.length && /^\s*>/.test(lines[i])) { buf.push(lines[i].replace(/^\s*>\s?/, '')); i++; }
      out.push(`<blockquote>${md(buf.join('\n'))}</blockquote>`); continue;
    }
    if (/^\s*\|/.test(l) && i + 1 < lines.length && /^\s*\|?\s*:?-{2,}/.test(lines[i + 1])) {
      const rows = [];
      while (i < lines.length && /^\s*\|/.test(lines[i])) { rows.push(lines[i]); i++; }
      const cells = r => r.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map(c => c.trim());
      const head = cells(rows[0]); const body = rows.slice(2).map(cells);
      out.push(`<table><thead><tr>${head.map(c => `<th>${inline(c)}</th>`).join('')}</tr></thead><tbody>${body.map(r => `<tr>${r.map(c => `<td>${inline(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>`);
      continue;
    }
    if (/^\s*([-*+]|\d+[.)])\s+/.test(l)) {
      const items = [];
      while (i < lines.length && (/^\s*([-*+]|\d+[.)])\s+/.test(lines[i]) || (/^\s{2,}\S/.test(lines[i]) && !isBlockStart(lines[i])))) { items.push(lines[i]); i++; }
      out.push(renderList(items)); continue;
    }
    const buf = [l]; i++;
    while (i < lines.length && !/^\s*$/.test(lines[i]) && !isBlockStart(lines[i])) { buf.push(lines[i]); i++; }
    out.push(`<p>${inline(buf.join(' '))}</p>`);
  }
  return out.join('\n');
}

// ---------- OpenSpec parsing ----------
function splitSections(text, level) {
  // returns [{title, body, raw}] split on headings of exactly `level` (#, ##, ###...)
  const re = new RegExp(`^#{${level}}\\s+(.*?)\\s*#*\\s*$`);
  const lines = text.replace(/\r\n?/g, '\n').split('\n');
  const out = []; let cur = { title: '', body: [] };
  let inFence = false;
  for (const l of lines) {
    if (/^\s*(```|~~~)/.test(l)) inFence = !inFence;
    const m = !inFence && l.match(re);
    if (m) { out.push(cur); cur = { title: m[1].trim(), body: [] }; }
    else cur.body.push(l);
  }
  out.push(cur);
  return out.map(s => ({ title: s.title, body: s.body.join('\n').trim() }));
}
function parseScenarioSteps(body) {
  const steps = [];
  for (const l of body.split('\n')) {
    let m = l.match(/^\s*[-*]\s*\*\*(WHEN|THEN|AND|GIVEN|BUT)\*\*:?\s*(.*)$/i);
    if (m) { steps.push({ kw: m[1].toUpperCase(), text: m[2] }); continue; }
    m = l.match(/^\s*[-*]\s*(WHEN|THEN|AND|GIVEN|BUT)\b:?\s*(.*)$/);
    if (m) { steps.push({ kw: m[1].toUpperCase(), text: m[2] }); continue; }
    if (l.trim()) steps.push({ kw: '', text: l.replace(/^\s*[-*]\s*/, '') });
  }
  return steps;
}
function parseRequirementBlock(title, body) {
  const parts = splitSections(body, 4);
  const text = parts[0].body;
  const scenarios = parts.slice(1).map(p => ({
    name: p.title.replace(/^Scenario:\s*/i, '').trim(),
    body: p.body, steps: parseScenarioSteps(p.body)
  }));
  const reason = (text.match(/\*\*Reason\*\*:?\s*([\s\S]*?)(?:\n\n|$)/) || [])[1];
  return { name: title.replace(/^Requirement:\s*/i, '').trim(), text, scenarios, reason, raw: `### ${title}\n\n${body}` };
}
function parseSpec(text) {
  const top = splitSections(text, 1);
  const title = top.length > 1 ? top[1].title : '';
  const body = top.length > 1 ? top[1].body : text;
  const secs = splitSections(body, 2);
  const spec = { title, purpose: '', requirements: [], other: [], preamble: secs[0].body };
  for (const s of secs.slice(1)) {
    if (/^purpose$/i.test(s.title)) spec.purpose = s.body;
    else if (/^requirements?$/i.test(s.title) || /requirement:/i.test(s.body)) {
      const reqs = splitSections(s.body, 3);
      if (reqs[0].body && !/^requirements?$/i.test(s.title)) spec.other.push({ title: s.title, body: reqs[0].body });
      for (const r of reqs.slice(1)) if (/^Requirement:/i.test(r.title)) spec.requirements.push(parseRequirementBlock(r.title, r.body));
      else spec.other.push({ title: r.title, body: r.body });
    } else spec.other.push({ title: s.title, body: s.body });
  }
  // requirements written directly under the H1 without a "## Requirements" header
  if (!spec.requirements.length) {
    for (const r of splitSections(body, 3).slice(1)) if (/^Requirement:/i.test(r.title)) spec.requirements.push(parseRequirementBlock(r.title, r.body));
  }
  return spec;
}
function parseDelta(text) {
  const d = { added: [], modified: [], removed: [], renamed: [], purpose: '', other: [] };
  for (const s of splitSections(text, 2).slice(1)) {
    const kind = (s.title.match(/^(ADDED|MODIFIED|REMOVED|RENAMED)\b/i) || [])[1];
    if (!kind) { if (/^purpose$/i.test(s.title)) d.purpose = s.body; else d.other.push(s); continue; }
    if (kind.toUpperCase() === 'RENAMED') {
      let from = null;
      for (const l of s.body.split('\n')) {
        let m = l.match(/^\s*[-*]\s*FROM:\s*`?\s*(?:###\s*)?(?:Requirement:\s*)?(.*?)`?\s*$/i);
        if (m) { from = m[1].trim(); continue; }
        m = l.match(/^\s*[-*]\s*TO:\s*`?\s*(?:###\s*)?(?:Requirement:\s*)?(.*?)`?\s*$/i);
        if (m && from) { d.renamed.push({ from, to: m[1].trim() }); from = null; }
      }
      continue;
    }
    const list = d[kind.toLowerCase()];
    for (const r of splitSections(s.body, 3).slice(1)) if (/^Requirement:/i.test(r.title)) list.push(parseRequirementBlock(r.title, r.body));
  }
  return d;
}
function parseTasks(text) {
  const lines = text.replace(/\r\n?/g, '\n').split('\n');
  const sections = []; let cur = { title: '', items: [] };
  let inFence = false;
  for (const l of lines) {
    if (/^\s*(```|~~~)/.test(l)) inFence = !inFence;
    if (inFence) continue;
    let m = l.match(/^#{1,4}\s+(.*?)\s*#*\s*$/);
    if (m) { if (cur.items.length || cur.title) sections.push(cur); cur = { title: m[1], items: [] }; continue; }

function layoutLineage(sp, r) {

function parseRepoSpec(s) {
  s = s.trim().replace(/\.git$/, '');
  let m = s.match(/^(?:https?:\/\/)?(?:www\.)?github\.com\/([^/\s]+)\/([^/\s]+)(?:\/tree\/([^/\s]+)(?:\/(.*))?)?\/?$/);

  return null;
}
async function ghFetchTree(repo, token) {

  const t = await api(`/repos/${repo.owner}/${repo.repo}/git/trees/${encodeURIComponent(ref)}?recursive=1`);
  if (!t.ok) throw new Error(await explain(t));
  const tree = await t.json();
  return { ref, tree };
}

async function pickFolder() {
  if (!window.showDirectoryPicker) { $('#fileinput').click(); return; }
  try {
    const h = await window.showDirectoryPicker({ mode: 'read' });
    closeDialog();
    await runLoad(() => loadFromDirectoryHandle(h));
  } catch (e) { if (e.name !== 'AbortError') { state.error = e.message; setStatus('error'); render(); } }
}
async function tryRestore() {
  const last = JSON.parse(localStorage.getItem('osv.last') || 'null');
  if (!last) return false;
  if (last.type === 'github') {
    const token = sessionStorage.getItem('osv.ghtoken') || localStorage.getItem('osv.ghtoken') || '';
    await runLoad(() => loadFromGithub(last.spec, token));
    return true;
  }
  if (last.type === 'local') {
    const recs = await idb.all();
    const rec = recs.find(r => r.id === last.id);
    if (!rec) return false;
    try {
      const perm = await rec.handle.queryPermission({ mode: 'read' });
      if (perm === 'granted') { await runLoad(() => loadFromDirectoryHandle(rec.handle)); return true; }
    } catch { }
    state.pendingReconnect = rec; // needs a user gesture
    return false;
  }
  return false;
}

}

function render({ keepScroll } = {}) {
  const y = window.scrollY;

  if (!state.model) { app.innerHTML = renderWelcome(); wireWelcome(); return; }
  const v = state.route.view;
  app.innerHTML = state.error ? `<div class="err">${esc(state.error)}</div>` : '';
  app.innerHTML += v === 'specs' ? renderSpecs() : v === 'changes' ? renderChanges() : v === 'project' ? renderProject() : renderOverview();

}
function wireCommon() {
  for (const d of document.querySelectorAll('details[data-key]')) {
    d.addEventListener('toggle', () => { if (d.open) state.open.add(d.dataset.key); else state.open.delete(d.dataset.key); });
  }
  $('#openonly') && ($('#openonly').onchange = e => { state.openOnly = e.target.checked; localStorage.setItem('osv.openOnly', state.openOnly ? '1' : '0'); render({ keepScroll: true }); });
  $('#specsearch') && ($('#specsearch').oninput = e => { state.specFilter = e.target.value; renderSideSpecs(); });
  $('#reqsearch') && ($('#reqsearch').oninput = e => { state.reqFilter = e.target.value; render({ keepScroll: true }); setTimeout(() => { const i = $('#reqsearch'); if (i) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); } }); });
  for (const b of document.querySelectorAll('[data-expand]')) b.onclick = () => { const open = b.dataset.expand === '1'; for (const d of b.closest('section, main').querySelectorAll('details[data-key]')) { d.open = open; if (open) state.open.add(d.dataset.key); else state.open.delete(d.dataset.key); } };
  for (const b of document.querySelectorAll('[data-dv]')) b.onclick = () => { state.deltaView[b.dataset.key] = b.dataset.dv; render({ keepScroll: true }); };
  const lc = $('.dia-lifecycle[data-live]');
  if (lc) lc.onclick = lc.onkeydown = e => {
    if (e.type === 'keydown' && e.key !== 'Enter' && e.key !== ' ') return;
    const g = e.target.closest('[data-stage]');
    if (!g || !g.hasAttribute('tabindex') || e.target.closest('a')) return;
    e.preventDefault();
    const st = g.dataset.stage;
    state.stageFilter = state.stageFilter === st ? null : st;
    render({ keepScroll: true });
    $(`.dia-lifecycle [data-stage="${st}"]`)?.focus();
  };
  $('#stageclear') && ($('#stageclear').onclick = () => { state.stageFilter = null; render({ keepScroll: true }); });
  for (const b of document.querySelectorAll('[data-iv]')) b.onclick = () => { state.impactView = b.dataset.iv; render({ keepScroll: true }); };

    for (const x of im.querySelectorAll('.on')) x.classList.remove('on');
    const hit = e.type === 'mouseover' && e.target.closest('[data-ch],[data-cap]');
    im.classList.toggle('focus', !!hit);
    if (!hit) return;
    const { ch, cap } = hit.dataset;
    const bands = [...im.querySelectorAll('.band')].filter(b => b === hit || (!(ch && cap) && ((ch && b.dataset.ch === ch) || (cap && b.dataset.cap === cap))));
    const chs = new Set(bands.map(b => b.dataset.ch)), caps = new Set(bands.map(b => b.dataset.cap));
    for (const b of bands) b.classList.add('on');
    for (const n of im.querySelectorAll('.node')) if (n === hit || chs.has(n.dataset.ch) || caps.has(n.dataset.cap)) n.classList.add('on');
  };
}

function wireSourceControls(root, { inDialog } = {}) {
  const pick = $('#pickbtn', root); if (pick) pick.onclick = pickFolder;
  const fi = $('#fileinput', root); if (fi) fi.onchange = () => { if (fi.files.length) { closeDialog(); runLoad(() => loadFromFileList(fi.files)); } };
  const drop = $('#drop', root);
  if (drop) {
    drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
    drop.ondragleave = () => drop.classList.remove('over');
    drop.ondrop = async e => {
      e.preventDefault(); drop.classList.remove('over');
      closeDialog();
      // prefer a directory handle when the browser gives one (keeps live refresh)
      const it = e.dataTransfer.items[0];
      if (it && it.getAsFileSystemHandle) { try { const h = await it.getAsFileSystemHandle(); if (h && h.kind === 'directory') { runLoad(() => loadFromDirectoryHandle(h)); return; } } catch { } }
      const files = await readDropEntries([...e.dataTransfer.items]);
      runLoad(() => loadFromFileList(files));
    };
  }
  const ghbtn = $('#ghbtn', root);
  const doGh = spec => {
    const token = $('#ghtoken', root).value.trim();
    if ($('#ghremember', root).checked) localStorage.setItem('osv.ghtoken', token); else { localStorage.removeItem('osv.ghtoken'); sessionStorage.setItem('osv.ghtoken', token); }
    closeDialog();
    runLoad(() => loadFromGithub(spec, token));
  };
  if (ghbtn) ghbtn.onclick = () => doGh($('#ghspec', root).value);
  const ghspec = $('#ghspec', root); if (ghspec) ghspec.onkeydown = e => { if (e.key === 'Enter') doGh(ghspec.value); };
  for (const b of root.querySelectorAll('[data-gh]')) b.onclick = () => doGh(b.dataset.gh);
  const rb = $('#reconnectbtn', root); if (rb) rb.onclick = () => { const rec = state.pendingReconnect; state.pendingReconnect = null; closeDialog(); runLoad(() => reconnect(rec)); };
  idb.all().then(recs => {
    const el = $('#recentlocal', root); if (!el || !recs.length) return;
    recs.sort((a, b) => b.lastOpened - a.lastOpened);
    el.innerHTML = `<span class="small muted">Recent</span>` + recs.map(r => `<button class="small" data-rec="${esc(r.id)}" title="Reopen (the browser may ask permission)">${esc(r.name)}</button><button class="small ghost" data-forget="${esc(r.id)}" title="Forget this folder">✕</button>`).join('');
    for (const b of el.querySelectorAll('[data-rec]')) b.onclick = () => { closeDialog(); runLoad(() => reconnect(recs.find(r => r.id === b.dataset.rec))); };
    for (const b of el.querySelectorAll('[data-forget]')) b.onclick = async () => { await idb.del(b.dataset.forget); b.previousElementSibling.remove(); b.remove(); };
  });
}

// ---------- overview ----------
function renderOverview() {
  const m = state.model, s = m.stats;
  const inProg = m.active.filter(c => c.status === 'progress');
  const notStarted = m.active.filter(c => c.status === 'untouched').length;
  const cells = [
    [s.specs, 'capabilities', m.ghostCaps.length ? `${m.ghostCaps.length} proposed` : ''],
    [s.requirements, 'requirements', plural(s.scenarios, 'scenario')],
    [s.active, 'active changes', `${inProg.length} in progress, ${notStarted} not started`],
    [`${pct(s.tasksDone, s.tasksTotal)}%`, 'of active tasks done', `${s.tasksDone} of ${s.tasksTotal}`],
    [s.deltas, 'pending spec deltas', `in ${plural(m.active.filter(c => c.deltas.length).length, 'change')}`],
    [s.archived, 'archived', m.archived[0]?.archivedDate ? `last on ${m.archived[0].archivedDate}` : '']
  ];
  // ledger of active changes, grouped by state, optionally narrowed to one lifecycle stage
  const sf = state.stageFilter;
  const groups = [['progress', 'In progress'], ['untouched', 'Not started'], ['complete', 'Complete, not archived'], ['draft', 'Drafting'], ['archived', 'Archived']].filter(([st]) => sf ? st === sf : st !== 'archived');
  const pool = sf === 'archived' ? m.archived : m.active;
  const lrow = ch => `<a class="lrow" href="${link('changes', ch.key)}">
      <span class="n">${esc(ch.name)}</span>
      <span class="pg">${ch.tasks ? `${bar(ch.tasks.done, ch.tasks.total)}<span class="num">${ch.tasks.done}/${ch.tasks.total}</span>` : '<span class="small muted">no tasks yet</span>'}</span>
      <span class="caps">${ch.deltas.map(d => `<span class="tag">${esc(d.capability)} ${deltaBadges(d)}</span>`).join('')}</span>
      <span class="when">${ch.created ? 'created ' + esc(ch.created) : ch.mtime ? 'updated ' + ago(ch.mtime) : ''}</span>
    </a>`;
  const ledger = `<div class="ledger">${groups.map(([st, t]) => { const list = pool.filter(c => c.status === st); return list.length ? `<div class="grp"><span class="pill ${st}"><span class="dot"></span>${t}</span><span class="num">${list.length}</span></div>${list.map(lrow).join('')}` : ''; }).join('')}</div>`;
  // impact matrix
  const capIds = [...m.specs.map(s => s.id), ...m.ghostCaps.map(g => g.id)];
  const withDeltas = m.active.filter(c => c.deltas.length);
  const matrix = withDeltas.length ? `<div class="matrix"><table><thead><tr><th>Change</th>${capIds.map(id => `<th>${m.specMap.has(id) ? `<a href="${link('specs', id)}">${esc(id)}</a>` : `${esc(id)} <span class="badge new">new</span>`}</th>`).join('')}<th>Tasks</th></tr></thead><tbody>${withDeltas.map(ch => `<tr><td><a href="${link('changes', ch.key, 'deltas')}">${esc(ch.name)}</a></td>${capIds.map(id => { const d = ch.deltas.find(x => x.capability === id); return `<td>${d ? `<span class="cell">${deltaBadges(d) || '<span class="badge gray">·</span>'}</span>` : ''}</td>`; }).join('')}<td style="min-width:130px">${ch.tasks ? `<div class="row" style="gap:8px;flex-wrap:nowrap"><span class="small num" style="min-width:34px;text-align:right">${pct(ch.tasks.done, ch.tasks.total)}%</span>${bar(ch.tasks.done, ch.tasks.total)}</div>` : '<span class="small muted">no tasks</span>'}</td></tr>`).join('')}</tbody></table></div>` : '<div class="empty">No active change carries spec deltas.</div>';
  const impactL = withDeltas.length ? layoutImpact(m) : null;
  const iv = impactL && !impactL.tooMany ? state.impactView : 'matrix';
  const ivBtn = (v, l) => `<button class="small ${iv === v ? 'primary' : ''}" data-iv="${v}" aria-pressed="${iv === v}">${l}</button>`;
  const impactHead = `<div class="h2row"><h2>Impact <span class="hn">${impactL?.tooMany ? `${impactL.pairs} change–capability pairs are too many to draw as a flow, so this is the matrix` : 'which active change touches which capability'}</span></h2>${impactL && !impactL.tooMany ? `<div class="row" style="gap:4px" role="group" aria-label="Impact view">${ivBtn('flow', 'Flow')}${ivBtn('matrix', 'Matrix')}</div>` : ''}</div>`;
  const impact = iv === 'flow' ? `<div class="dia dia-impact">${svgImpact(impactL)}</div>` : matrix;
  // next open tasks
  const nextUp = inProg.map(ch => { const open = ch.tasks.sections.flatMap(s => s.items.filter(i => !i.done && i.depth === 0).map(i => ({ ...i, sec: s.title }))).slice(0, 3); return open.length ? `<div class="nx"><div class="t"><a href="${link('changes', ch.key, 'tasks')}">${esc(ch.name)}</a><span class="small muted num">${ch.tasks.total - ch.tasks.done} open</span></div><ul>${open.map(i => `<li><span class="cb"></span><span><span class="muted num">${esc(i.id)}</span> ${inline(i.text)}</span></li>`).join('')}</ul></div>` : ''; }).join('');
  // attention
  const nWarn = m.issues.filter(i => i.lvl === 'warn').length, nInfo = m.issues.filter(i => i.lvl === 'info').length;
  const issues = m.issues.length ? `${m.issues.slice(0, 40).map(i => `<div class="issue"><span class="ic ${i.lvl === 'info' ? 'info' : ''}">${i.lvl === 'info' ? 'i' : '!'}</span><span>${i.text} <a href="${i.href}" class="small">open</a></span></div>`).join('')}${m.issues.length > 40 ? `<div class="small muted" style="padding-top:8px">${m.issues.length - 40} more not shown</div>` : ''}` : '<div class="empty">Deltas match the current specs, every requirement has scenarios, and no change is stuck.</div>';
  // capabilities
  const caps = m.specs.map(sp => {
    const pend = sp.pendingAdds.length + sp.pendingMods.length + sp.pendingRemoves.length + sp.pendingRenames.length;
    return `<a class="capentry" href="${link('specs', sp.id)}"><div class="t"><span class="n">${esc(sp.id)}</span>${pend ? `<span class="badge mod">${pend} pending</span>` : ''}</div><div class="p">${esc(sp.purpose.replace(/[*_`]/g, '').slice(0, 240))}</div><div class="m"><span class="num">${plural(sp.requirements.length, 'requirement')}</span><span class="num">${plural(sp.requirements.reduce((n, r) => n + r.scenarios.length, 0), 'scenario')}</span>${sp.history.length ? `<span class="num">${plural(sp.history.length, 'archived change')}</span>` : ''}${sp.changes.map(c => `<span class="tag">${esc(c.name)}</span>`).join('')}</div></a>`;
  }).join('') + m.ghostCaps.map(g => `<a class="capentry ghost" href="${link('changes', g.changes[0].key, 'deltas')}"><div class="t"><span class="n">${esc(g.id)}</span><span class="badge new">new capability</span></div><div class="p">${esc((g.purpose || '').replace(/[*_`]/g, '').slice(0, 240))}</div><div class="m"><span class="num">${plural(g.reqCount, 'requirement')} proposed</span>${g.changes.map(c => `<span class="tag">${esc(c.name)}</span>`).join('')}</div></a>`).join('');
  // history
  const tl = [...m.archived].sort((a, b) => (b.archivedDate || '').localeCompare(a.archivedDate || ''));
  const timeline = tl.length ? `<div class="tl">${tl.map(ch => `<div class="d">${esc(ch.archivedDate || '')}</div><div class="e"><a href="${link('changes', ch.key)}">${esc(ch.name)}</a>${ch.tasks ? `<span class="small muted num">${ch.tasks.total} tasks</span>` : ''}${ch.deltas.map(d => `<span class="tag">${esc(d.capability)} ${deltaBadges(d)}</span>`).join('')}</div>`).join('')}</div>` : '<div class="empty">Nothing archived yet.</div>';
  return `
    ${pageHead('Overview', [esc(state.source.label), `<span class="num">${m.fileCount} files</span>`, state.loadedAt && `read ${ago(state.loadedAt)}`, state.source.truncated && '<span class="notice" style="margin:0;padding:2px 8px">GitHub truncated the file listing; some files may be missing.</span>'], cells)}
    <h2>Flow <span class="hn">where each active change stands</span></h2>
    <div class="dia dia-lifecycle" data-live>${svgLifecycle(layoutLifecycle(m), { active: sf })}</div>
    <h2>${sf === 'archived' ? 'Archived changes' : 'Active changes'} <span class="hn">${sf ? `showing ${esc(STATUS[sf])} only<button class="small" id="stageclear">show all</button>` : 'grouped by state'}</span></h2>
    ${sf ? (pool.some(c => c.status === sf) ? ledger : `<div class="empty">No change is at the ${esc(STATUS[sf])} stage.</div>`) : m.active.length ? ledger : '<div class="empty">No active changes. Everything is archived, or nothing has been proposed yet.</div>'}
    <div class="two">
      ${nextUp ? `<div><h2>Next open tasks <span class="hn">first three per change in progress</span></h2>${nextUp}</div>` : ''}
      <div><h2>Needs attention <span class="hn">${m.issues.length ? `${nWarn} warnings, ${nInfo} notes` : 'nothing flagged'}</span></h2>${issues}</div>
    </div>
    ${impactHead}
    ${impact}
    <h2>Capabilities <span class="hn">${plural(m.specs.length, 'spec')}${m.ghostCaps.length ? `, ${m.ghostCaps.length} proposed` : ''}</span></h2>
    <div class="capgrid">${caps || '<div class="empty">No specs yet.</div>'}</div>

    ${timeline}`;
}

// ---------- specs ----------

  const norm = s => s.trim().toLowerCase().replace(/\s+/g, ' ');

  const modsFor = r => sp.pendingMods.filter(p => norm(p.curName) === norm(r.name));
  const remsFor = r => sp.pendingRemoves.filter(p => norm(p.curName) === norm(r.name));

    const lin = layoutLineage(sp, r);
    const extra = lin.events.length ? `<div class="dia dia-lineage">${svgLineage(lin)}</div>` : '';
    return requirementHtml(r, `spec:${sp.id}:${r.name}`, { badges, cls: rems.length ? 'removed' : '', extra });

// ---------- changes ----------
function renderChanges() {
  const m = state.model;
  const ch = m.changes.find(c => c.key === state.route.id) || m.active[0] || m.changes[0];
  const item = c => `<a class="item ${ch && c.key === ch.key ? 'on' : ''}" href="${link('changes', c.key, state.route.tab)}"><div class="t"><span class="n">${esc(c.name)}</span><span class="m">${c.archived ? esc(c.archivedDate || '') : c.tasks ? `${c.tasks.done}/${c.tasks.total}` : 'draft'}</span></div>${!c.archived && c.tasks ? bar(c.tasks.done, c.tasks.total) : ''}</a>`;
  const side = `<aside class="side"><h4><span>Active</span><span class="num">${m.active.length}</span></h4>${m.active.map(item).join('') || '<div class="empty small">None.</div>'}<h4><span>Archived</span><span class="num">${m.archived.length}</span></h4>${m.archived.map(item).join('') || '<div class="empty small">None.</div>'}</aside>`;
  if (!ch) return `<div class="split">${side}<div class="empty">No changes under changes/.</div></div>`;
  const tab = state.route.tab || 'proposal';
  const tabs = [['proposal', 'Proposal'], ['tasks', `Tasks${ch.tasks ? `<span class="c">${ch.tasks.done}/${ch.tasks.total}</span>` : ''}`], ['deltas', `Spec deltas<span class="c">${ch.deltas.reduce((n, d) => n + d.count, 0)}</span>`], ch.design && ['design', 'Design'], ['files', `Files<span class="c">${ch.files.length}</span>`]].filter(Boolean);
  let body = '';
  if (tab === 'proposal') body = ch.proposal.raw ? `<div class="md">${md(ch.proposal.raw)}</div>` : '<div class="empty">This change has no proposal.md.</div>';
  else if (tab === 'tasks') body = renderTasks(ch);
  else if (tab === 'deltas') body = renderDeltas(ch);
  else if (tab === 'design') body = `<div class="md">${md(ch.design)}</div>`;
  else if (tab === 'files') body = `<ul class="filelist">${ch.files.map(f => `<li>${esc(f.rel)}${f.mtime ? ` <span class="muted">${ago(f.mtime)}</span>` : ''}${f.text ? ` <span class="muted">${f.text.length.toLocaleString()} chars</span>` : ''}</li>`).join('')}</ul>${state.source.type === 'github' ? `<p class="small"><a href="https://github.com/${esc(state.source.repo.owner)}/${esc(state.source.repo.repo)}/tree/${esc(state.source.repo.ref)}/${esc(state.source.url.split('/tree/' + state.source.repo.ref + '/')[1] || '')}${esc(ch.dir)}" target="_blank" rel="noopener">Open this folder on GitHub</a></p>` : ''}`;
  const nDeltas = ch.deltas.reduce((n, d) => n + d.count, 0);
  const cells = [
    [pill(ch), 'state'],
    ch.tasks ? [`${pct(ch.tasks.done, ch.tasks.total)}%`, 'tasks done', `${ch.tasks.done} of ${ch.tasks.total}`] : ['0', 'tasks', 'no tasks.md yet'],
    [nDeltas, 'spec deltas', ch.deltas.length ? `across ${ch.deltas.length} ${ch.deltas.length === 1 ? 'capability' : 'capabilities'}` : ''],
    ch.archivedDate ? [esc(ch.archivedDate), 'archived'] : ch.created ? [esc(ch.created), 'created'] : null
  ];
  const metaParts = [`<span class="path">${esc(ch.dir)}</span>`, ch.created && ch.archivedDate && `created ${esc(ch.created)}`, ch.mtime && `updated ${ago(ch.mtime)}`, ch.schema && `schema ${esc(ch.schema)}`];
  return `<div class="split">${side}<section>
    ${pageHead(esc(ch.name), metaParts, cells)}
    ${ch.tasks && !ch.archived ? `<div class="row" style="gap:12px;margin-bottom:8px"><div style="flex:1">${bar(ch.tasks.done, ch.tasks.total, true)}</div></div>` : ''}
    ${ch.deltas.length ? `<div class="row" style="gap:6px"><span class="small muted">Touches</span>${ch.deltas.map(d => `<a class="tag" href="${link('changes', ch.key, 'deltas')}">${esc(d.capability)} ${deltaBadges(d)}${m.specMap.has(d.capability) ? '' : ' <span class="badge new">new</span>'}</a>`).join('')}</div>` : ''}
    <div class="tabs">${tabs.map(([t, l]) => `<a href="${link('changes', ch.key, t)}" class="${tab === t ? 'on' : ''}">${l}</a>`).join('')}</div>

}
function renderTasks(ch) {
  if (!ch.tasks) return '<div class="empty">This change has no tasks.md.</div>';
  const t = ch.tasks;
  const secs = t.sections.map((s, si) => {
    const items = s.items.filter(i => !state.openOnly || !i.done);
    if (!items.length) return '';
    return `<div class="tsec"><div class="th"><span class="n">${inline(s.title || 'Tasks')}</span><span class="num">${s.done}/${s.total}</span>${bar(s.done, s.total)}</div><ul>${items.map(i => `<li class="${i.done ? 'done' : ''} d${i.depth}"><span class="cb ${i.done ? 'on' : ''}"></span>${i.id ? `<span class="id">${esc(i.id)}</span>` : ''}<span class="tx">${inline(i.text)}</span></li>`).join('')}</ul></div>`;
  }).join('');
  return `<div class="row spread" style="margin-bottom:14px"><label class="tgl small"><input type="checkbox" id="openonly" ${state.openOnly ? 'checked' : ''}> Open tasks only</label><span class="small muted num">${t.total - t.done} open</span></div>${t.preamble ? `<div class="doc md small" style="margin-bottom:16px;font-size:14px">${md(t.preamble)}</div>` : ''}${secs || '<div class="empty">Every task is done.</div>'}`;
}
function renderDeltas(ch) {
  const m = state.model;
  if (!ch.deltas.length) return '<div class="empty">This change carries no spec deltas: there is no specs/&lt;capability&gt;/spec.md inside it.</div>';
  const norm = s => s.trim().toLowerCase().replace(/\s+/g, ' ');
  return ch.deltas.map(d => {
    const sp = m.specMap.get(d.capability);
    const cur = name => sp?.requirements.find(r => norm(r.name) === norm(resolveDeltaName(d, name)));
    const block = (list, kind, label, cls) => list.map(r => {
      let extra = ''; let badges = `<span class="badge ${cls}">${label}</span>`;
      if (kind === 'modified' || kind === 'removed') {
        const c = cur(r.name);
        if (!c) extra = `<div class="notice">No requirement named “${esc(r.name)}” exists in the current <b>${esc(d.capability)}</b> spec${ch.archived ? ' (it may have been renamed since)' : ''}.</div>`;
        else if (kind === 'modified') {
          const key = `${ch.key}:${d.capability}:${r.name}`; const v = state.deltaView[key] || 'diff';
          const btn = (id, l) => `<button class="small ${v === id ? 'primary' : ''}" data-dv="${id}" data-key="${esc(key)}">${l}</button>`;
          extra = `<div class="row" style="margin-bottom:10px;gap:4px">${btn('diff', 'Diff')}${btn('proposed', 'Proposed')}${btn('current', 'Current')}</div>`;
          const plain = t => t.replace(/^### Requirement:.*\n+/, '').replace(/^#### Scenario:\s*/gm, 'Scenario: ').replace(/\*\*(WHEN|THEN|AND|GIVEN|BUT)\*\*/g, '$1').replace(/^\s*[-*]\s+/gm, '• ');
          if (v === 'diff') return `<details class="req" data-key="d:${esc(key)}" ${state.open.has('d:' + key) ? 'open' : ''}><summary><span class="rn">${esc(r.name)}</span>${badges}<span class="rm">${r.scenarios.length} vs ${c.scenarios.length} scenarios</span></summary><div class="rb">${extra}${renderDiff(plain(c.raw), plain(r.raw))}</div></details>`;
          if (v === 'current') return requirementHtml(c, `d:${key}`, { badges: `<span class="badge gray">current</span>`, extra });
        }
      }
      if (kind === 'added' && cur(r.name)) extra = `<div class="notice">A requirement with this name already exists in <b>${esc(d.capability)}</b>.</div>`;
      return requirementHtml(r, `d:${ch.key}:${d.capability}:${kind}:${r.name}`, { badges, extra, cls: kind === 'removed' ? 'removed' : '' });
    }).join('');
    const ren = d.renamed.length ? `<div class="renames">${d.renamed.map(r => `<div class="row"><span class="badge ren">renamed</span><span>${esc(r.from)}</span><span class="muted">→</span><b>${esc(r.to)}</b>${!sp?.requirements.some(x => norm(x.name) === norm(r.from)) ? `<span class="badge gray" title="No requirement with the old name exists in the current spec">not in spec</span>` : ''}</div>`).join('')}</div>` : '';
    const blocks = `${block(d.added, 'added', 'added', 'add')}${block(d.modified, 'modified', 'modified', 'mod')}${block(d.removed, 'removed', 'removed', 'rem')}`;
    return `<section style="margin-bottom:28px"><div class="h2row"><h2>${sp ? `<a href="${link('specs', d.capability)}" style="color:inherit;text-decoration:none">${esc(d.capability)}</a>` : `${esc(d.capability)} <span class="badge new">new capability</span>`} <span class="row" style="gap:3px">${deltaBadges(d)}</span></h2><div class="row"><button class="small" data-expand="1">Expand all</button><button class="small" data-expand="0">Collapse all</button></div></div>
      ${d.purpose ? `<div class="md" style="margin-bottom:12px">${md(d.purpose)}</div>` : ''}
      ${blocks ? `<div class="reqs">${blocks}</div>` : ''}${ren}
      ${d.other.length ? `<div class="reqs" style="margin-top:12px">${d.other.map(o => `<details class="req" data-key="d:${esc(ch.key)}:${esc(d.capability)}:§${esc(o.title)}"><summary><span class="rn">${esc(o.title)}</span><span class="rm">section</span></summary><div class="rb md">${md(o.body)}</div></details>`).join('')}</div>` : ''}
    </section>`;
  }).join('');
}

// ---------- boot ----------
(async function boot() {
  applyTheme(themeSetting());
  parseHash();
  render();
  // programmatic loading hook (used for testing and for embedding): OSV.loadFiles([{path, text, mtime}], 'label')
  window.OSV = { loadFiles: (files, label = 'in-memory') => applyLoad({ source: { type: 'files', label }, files }), state, parseSpec, parseDelta, parseTasks, buildModel, md, layoutLifecycle, layoutImpact, layoutLineage };
  // whole-page drop target
  document.body.addEventListener('dragover', e => { if (e.dataTransfer.types.includes('Files')) e.preventDefault(); });
  document.body.addEventListener('drop', async e => {
    if (!e.dataTransfer.types.includes('Files')) return;
    e.preventDefault();
    const it = e.dataTransfer.items[0];
    if (it && it.getAsFileSystemHandle) { try { const h = await it.getAsFileSystemHandle(); if (h && h.kind === 'directory') { closeDialog(); runLoad(() => loadFromDirectoryHandle(h)); return; } } catch { } }
    const files = await readDropEntries([...e.dataTransfer.items]); closeDialog(); runLoad(() => loadFromFileList(files));
  });
  const restored = await tryRestore();
  if (!restored) render();
})();
</script>
</body>
</html>
